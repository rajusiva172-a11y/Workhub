<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WorkHub - Apply Job</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f5f7fb;
    }

    header {
        background: #0b3d91;
        color: white;
        padding: 20px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
    }

    .logo span {
        color: #ff9800;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
    }

    .container {
        max-width: 700px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .form-card {
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .form-card h1 {
        color: #0b3d91;
        margin-top: 0;
    }

    .selected-job {
        background: #eef4ff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 25px;
        color: #0b3d91;
        font-weight: bold;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    textarea {
        height: 100px;
        resize: vertical;
    }

    .submit-btn {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        background: #ff9800;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .submit-btn:hover {
        background: #e68900;
    }

    .back-btn {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: #0b3d91;
        text-decoration: none;
        font-weight: bold;
    }

    .success {
        display: none;
        text-align: center;
        padding: 30px;
    }

    .success h1 {
        color: #0b3d91;
    }

</style>
```

</head>

<body>

<header>

```
<div class="logo">
    WORK<span>HUB</span>
</div>

<nav>
    <a href="index.html">Home</a>
    <a href="jobs.html">Jobs</a>
</nav>
```

</header>

<div class="container">

```
<div class="form-card" id="applicationForm">

    <h1>Apply for Job</h1>

    <div class="selected-job">
        Job: <span id="jobTitle"></span>
    </div>


    <form onsubmit="submitApplication(event)">


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <label for="mobile">
            Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="qualification">
            Qualification
        </label>

        <select id="qualification" required>

            <option value="">
                Select Qualification
            </option>

            <option value="10th">
                10th
            </option>

            <option value="12th">
                12th
            </option>

            <option value="ITI">
                ITI
            </option>

            <option value="Diploma">
                Diploma
            </option>

            <option value="Degree">
                Degree
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label for="experience">
            Experience
        </label>

        <select id="experience" required>

            <option value="">
                Select Experience
            </option>

            <option value="Fresher">
                Fresher
            </option>

            <option value="1-2 Years">
                1 - 2 Years
            </option>

            <option value="3-5 Years">
                3 - 5 Years
            </option>

            <option value="5+ Years">
                5+ Years
            </option>

        </select>


        <label for="address">
            Address
        </label>

        <textarea
            id="address"
            placeholder="Enter your address"
            required
        ></textarea>


        <label for="message">
            Additional Information
        </label>

        <textarea
            id="message"
            placeholder="Tell us anything about yourself..."
        ></textarea>


        <button
            type="submit"
            class="submit-btn">

            Submit Application

        </button>

    </form>


    <a href="jobs.html" class="back-btn">
        ← Back to Jobs
    </a>

</div>


<div class="form-card success" id="successMessage">

    <h1>Application Submitted! 🎉</h1>

    <p>
        Thank you for applying.
    </p>

    <p>
        Your application has been received successfully.
    </p>

    <a href="jobs.html" class="back-btn">
        ← Browse More Jobs
    </a>

</div>
```

</div>

<script>


// Get job name from URL

const params =
    new URLSearchParams(window.location.search);

const jobName =
    params.get("job");


// Display job name

if (jobName) {

    document.getElementById("jobTitle").textContent =
        jobName;

} else {

    document.getElementById("jobTitle").textContent =
        "Job Application";

}


// Submit Application

function submitApplication(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value;

    const mobile =
        document.getElementById("mobile").value;

    const email =
        document.getElementById("email").value;

    const qualification =
        document.getElementById("qualification").value;

    const experience =
        document.getElementById("experience").value;


    console.log("Application Details:");

    console.log("Job:", jobName);

    console.log("Name:", name);

    console.log("Mobile:", mobile);

    console.log("Email:", email);

    console.log("Qualification:", qualification);

    console.log("Experience:", experience);


    // Hide form

    document.getElementById("applicationForm").style.display =
        "none";


    // Show success message

    document.getElementById("successMessage").style.display =
        "block";

}

</script>

</body>

</html>
