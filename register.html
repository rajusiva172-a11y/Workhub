
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WorkHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container nav-container">
            <h1 class="logo">Work<span>Hub</span></h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="jobs.html">Jobs</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <!-- Registration Form -->
    <main class="container job-container">
        <div class="form-container">
            <h2>Create Your Account</h2>
            <p>Join WorkHub and explore job opportunities.</p>

            <form id="registerForm">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

                <button type="submit" class="btn">Create Account</button>
            </form>

            <p id="registerMessage" style="display:none; margin-top:20px;"></p>

            <p>
                Already have an account?
                <a href="login.html" class="text-link">Login here</a>
            </p>

            <p>
                <a href="index.html" class="text-link">← Back to Home</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 WorkHub. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById("registerForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const message =
                    document.getElementById("registerMessage");

                if (password !== confirmPassword) {
                    message.textContent =
                        "Passwords do not match. Please try again.";
                    message.style.display = "block";
                    return;
                }

                message.textContent =
                    "Demo only: Registration form validated, but no account was saved.";
                message.style.display = "block";
            }
        );
    </script>

</body>
</html>
