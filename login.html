<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WorkHub - Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7fb;
        }

        /* Header */

        header {
            background: #0b3d91;
            color: white;
            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ff9800;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }


        /* Login Box */

        .login-container {
            min-height: 85vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .login-box {
            background: white;

            width: 400px;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .login-box h1 {
            text-align: center;
            color: #0b3d91;

            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #666;

            margin-bottom: 30px;
        }


        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;
        }

        .input-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;

            border-color: #0b3d91;
        }


        /* Login Button */

        .login-btn {
            width: 100%;

            padding: 14px;

            background: #0b3d91;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #082f70;
        }


        /* Divider */

        .divider {
            display: flex;

            align-items: center;

            margin: 25px 0;

            color: #999;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;
        }

        .divider span {
            padding: 0 10px;
        }


        /* Google Button */

        .google-btn {
            width: 100%;

            padding: 13px;

            background: white;

            color: #333;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }


        /* Register */

        .register {
            text-align: center;

            margin-top: 25px;

            color: #666;
        }

        .register a {
            color: #0b3d91;

            font-weight: bold;

            text-decoration: none;
        }


        /* Back Home */

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #0b3d91;

            text-decoration: none;
        }


        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            .login-box {
                width: 100%;
            }

            nav {
                display: none;
            }

        }

    </style>

</head>


<body>


<!-- Header -->

<header>

    <div class="logo">
        WORK<span>HUB</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="#">
            Jobs
        </a>

    </nav>

</header>


<!-- Login -->

<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back!</h1>

        <p>
            Login to find your next job
        </p>


        <!-- Username / Email -->

        <div class="input-group">

            <label>
                Username or Email
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username or email"
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

        </div>


        <!-- Login -->

        <button
            class="login-btn"
            onclick="loginUser()">

            Login

        </button>


        <!-- Divider -->

        <div class="divider">

            <span>OR</span>

        </div>


        <!-- Google -->

        <button
            class="google-btn"
            onclick="googleLogin()">

            🌐 Continue with Google

        </button>


        <!-- Register -->

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


        <!-- Home -->

        <a
            class="back-home"
            href="index.html">

            ← Back to Home

        </a>

    </div>

</div>


<script>

function loginUser() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (username === "") {

        alert("Please enter your username or email.");

        return;

    }


    if (password === "") {

        alert("Please enter your password.");

        return;

    }


    /*
       Demo login

       Real login will be connected
       with database later.
    */

    alert("Login successful!");

    window.location.href = "index.html";

}


function googleLogin() {

    alert(
        "Google Login will be connected in the next step."
    );

}

</script>


</body>

</html>
